<div class="p-8 bg-gray-50 min-h-screen">

  <!-- Tailwind heading -->
  <h1 class="text-4xl font-bold text-center text-green-600 mb-10">
    Finance Tracker Test Page 🚀
  </h1>

  <!-- Dashboard card grid -->
  <div class="flex flex-wrap -mx-4">
    <div class="w-full sm:w-1/2 lg:w-1/4 px-4 mb-4">
      <p-card header="Total Income">
        <p-button label="View" icon="pi pi-eye" class="w-full bg-blue-500 text-white hover:bg-blue-600"></p-button>
      </p-card>
    </div>
    <div class="w-full sm:w-1/2 lg:w-1/4 px-4 mb-4">
      <p-card header="Total Expenses">
        <p-button label="View" icon="pi pi-eye" class="w-full bg-red-500 text-white hover:bg-red-600"></p-button>
      </p-card>
    </div>
    <div class="w-full sm:w-1/2 lg:w-1/4 px-4 mb-4">
      <p-card header="Budgets">
        <p-button label="Manage" icon="pi pi-cog" class="w-full bg-yellow-500 text-white hover:bg-yellow-600"></p-button>
      </p-card>
    </div>
    <div class="w-full sm:w-1/2 lg:w-1/4 px-4 mb-4">
      <p-card header="Reports">
        <p-button label="View" icon="pi pi-chart-line" class="w-full bg-green-500 text-white hover:bg-green-600"></p-button>
      </p-card>
    </div>
  </div>

</div>
