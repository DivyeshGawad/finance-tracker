<div class="flex bg-gray-50">
  <!-- 🌐 Header -->
  <header class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between 
         bg-blue-700 text-white px-6 py-3 shadow-md transition-colors duration-300">
    <!-- Project Name -->
    <div class="flex items-center gap-2 text-xl font-semibold tracking-wide">
      <i class="pi pi-coins text-yellow-300"></i>
      <span>Finance Tracker</span>
    </div>

    <!-- Right Section -->
    <div class="flex items-center gap-4">
      <!-- User Icon -->
      <div class="relative">
        <button id="user-menu-button" (click)="toggleUserMenu()"
          class="flex items-center gap-2 bg-blue-600 px-3 py-2 rounded-full hover:bg-blue-500 transition">
          <i class="pi pi-user text-lg"></i>
          <i class="pi" [ngClass]="isUserMenuOpen ? 'pi-chevron-up' : 'pi-chevron-down'"></i>
        </button>

        <!-- Dropdown Menu -->
        <div *ngIf="isUserMenuOpen"
          class="absolute right-0 mt-2 w-40 bg-white text-gray-800 rounded-lg shadow-lg py-2 animate-fadeIn dropdown-menu z-50">
          <a routerLink="/profile" class="block px-4 py-2 hover:bg-gray-100 transition" (click)="closeUserMenu()">
            <i class="pi pi-id-card mr-2 text-blue-700"></i> My Profile
          </a>
          <hr class="border-gray-200" />
          <button (click)="logout()" class="w-full text-left px-4 py-2 hover:bg-gray-100 transition">
            <i class="pi pi-sign-out mr-2 text-red-600"></i> Logout
          </button>
        </div>
      </div>

      <!-- Hamburger (Mobile Only) -->
      <button class="sm:hidden text-2xl focus:outline-none" (click)="isSidebarOpen = !isSidebarOpen">
        <i class="pi pi-bars"></i>
      </button>
    </div>
  </header>


  <!-- 🧭 Sidebar -->
  <aside class="fixed top-0 left-0 h-full w-64 bg-blue-700 text-white z-40 
           transform transition-transform duration-300 ease-in-out sm:translate-x-0"
    [class.-translate-x-full]="!isSidebarOpen && isMobile()">
    <!-- Sidebar Title -->
    <div class="p-4 text-lg font-semibold flex items-center gap-2 
             border-b border-blue-500 tracking-wide">
      <i class="pi pi-th-large"></i> Menu
    </div>

    <!-- Navigation Links -->
    <nav class="flex flex-col mt-4">
      <a routerLink="/dashboard" routerLinkActive="bg-blue-600" (click)="closeSidebarOnMobile()"
        class="px-5 py-3 hover:bg-blue-500 rounded flex items-center gap-3 transition">
        <i class="pi pi-home"></i> Dashboard
      </a>

      <a routerLink="/transactions" routerLinkActive="bg-blue-600" (click)="closeSidebarOnMobile()"
        class="px-5 py-3 hover:bg-blue-500 rounded flex items-center gap-3 transition">
        <i class="pi pi-wallet"></i> Transactions
      </a>

      <a routerLink="/budgets" routerLinkActive="bg-blue-600" (click)="closeSidebarOnMobile()"
        class="px-5 py-3 hover:bg-blue-500 rounded flex items-center gap-3 transition">
        <i class="pi pi-chart-bar"></i> Budgets
      </a>

      <a routerLink="/reports" routerLinkActive="bg-blue-600" (click)="closeSidebarOnMobile()"
        class="px-5 py-3 hover:bg-blue-500 rounded flex items-center gap-3 transition">
        <i class="pi pi-file"></i> Reports
      </a>
    </nav>
  </aside>

  <!-- 📄 Main Content -->
  <main class="flex-1 pt-16 sm:ml-32 p-6 overflow-y-auto transition-all duration-300">
    <router-outlet></router-outlet>
  </main>
</div>
