
<div class="max-w-[1200px] mx-auto">
  <h1 class="text-2xl font-bold mb-6 text-gray-800">Dashboard Overview</h1>
  <!-- Cards Section -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 ">
    <!-- Card 1 -->
    <div
      class="rounded-xl p-6 shadow-lg text-white bg-gradient-to-r from-blue-500 to-cyan-500 hover:scale-[1.03] transition-all duration-300 hover:shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold">Total Income</h2>
        <div class="flex items-center">
          <i class="pi pi-wallet text-4xl"></i>
        </div>
      </div>
      <h1 class="text-2xl font-bold text-white">&#8377;11,534</h1>
    </div>
    <!-- Card 2 -->
    <div
      class="rounded-xl p-6 shadow-lg text-white bg-gradient-to-r from-purple-500 to-pink-500 hover:scale-[1.03] transition-all duration-300 hover:shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold">Total Expense</h2>
        <div class="flex items-center">
          <i class="pi pi-shopping-cart text-4xl"></i>
        </div>
      </div>
      <h1 class="text-2xl font-bold text-white">&#8377;17,000</h1>
    </div>
    <!-- Card 3 -->
    <div
      class="rounded-xl p-6 shadow-lg text-white bg-gradient-to-r from-green-500 to-emerald-500 hover:scale-[1.03] transition-all duration-300 hover:shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold">Budget Used</h2>
        <div class="flex items-center">
          <i class="pi pi-chart-pie text-4xl"></i>
        </div>
      </div>
      <h1 class="text-2xl font-bold text-white">&#8377;17,000</h1>
    </div>
    <!-- Card 4 -->
    <div
      class="rounded-xl p-6 shadow-lg text-white bg-gradient-to-r from-orange-500 to-red-500 hover:scale-[1.03] transition-all duration-300 hover:shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold">Reports Generated</h2>
        <div class="flex items-center">
          <i class="pi pi-chart-bar text-xl"></i>
        </div>
      </div>
      <h1 class="text-2xl font-bold text-white">&#8377;17,000</h1>
    </div>
  </div>

  <!-- Chart Section -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
    <!-- LEFT: PIE CHART -->
    <div class="bg-white shadow-md rounded-2xl p-6">
      <h2 class="text-lg font-semibold mb-4">Expenses By Category</h2> <p-chart type="pie" [data]="chartData"
        [options]="chartOptions"></p-chart>
    </div>
    <!-- RIGHT: TABLE -->
    <div class="bg-white shadow-md rounded-2xl p-6 overflow-auto">
      <h2 class="text-lg font-semibold mb-4">Transaction History</h2>
      <table class="w-full text-left rounded-xl overflow-hidden border-2 border-gray-200 text-gray-700">
        <thead class=" bg-gradient-to-r from-blue-500 to-cyan-500">
          <tr>
            <th class="px-6 py-4 font-bold text-white">Name</th>
            <th class="px-6 py-4 font-bold text-white">Date</th>
            <th class="px-6 py-4 font-bold text-white">State</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100 border-gray-300">
          <tr class="bg-white">
            <td class="px-6 py-4">Helen Howard</td>
            <td class="px-6 py-4">Nov.4 2022</td>
            <td class="px-6 py-4"> <span
                class="inline-flex items-center gap-1 rounded bg-gradient-to-r from-emerald-600 to-green-400 px-4 py-1 text-xs font-semibold text-white">
                Paid </span> </td>
          </tr>
          <tr class="bg-white">
            <td class="px-6 py-4">Helen Howard</td>
            <td class="px-6 py-4">Nov.4 2022</td>
            <td class="px-6 py-4"> <span
                class="inline-flex items-center gap-1 rounded bg-gradient-to-r from-emerald-600 to-green-400 px-4 py-1 text-xs font-semibold text-white">
                Paid </span> </td>
          </tr>
          <tr class="bg-white">
            <td class="px-6 py-4">Helen Howard</td>
            <td class="px-6 py-4">Nov.4 2022</td>
            <td class="px-6 py-4"> <span
                class="inline-flex items-center gap-1 rounded bg-gradient-to-r from-red-700 to-red-400 px-4 py-1 text-xs font-semibold text-white">
                Canceled </span> </td>
          </tr>
          <tr class="bg-white">
            <td class="px-6 py-4">Helen Howard</td>
            <td class="px-6 py-4">Nov.4 2022</td>
            <td class="px-6 py-4"> <span
                class="inline-flex items-center gap-1 rounded bg-gradient-to-r from-red-700 to-red-400 px-4 py-1 text-xs font-semibold text-white">
                Canceled </span> </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
