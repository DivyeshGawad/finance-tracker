<div class="bg-gray-50 px-6 sm:px-10 py-8 overflow-x-hidden">
  <!-- Header -->
   <app-page-header
   title="Transactions"
   emoji="💰"
   placeholder="Search Transactions..."
   showAddButtonText="Add Transaction"
   (searchChange)="table.filterGlobal($event, 'contains')"
   icons="pi pi-plus"
   (addClick)="addTransaction()"
   ></app-page-header>
  
  <!-- Table -->
  <div class="bg-white border border-gray-200 shadow-md rounded-lg overflow-x-auto">
    <p-table
      #table
      [value]="transactions"
      [paginator]="true"
      [rows]="5"
      [globalFilterFields]="['transactionDate', 'categoryName', 'categoryType', 'description', 'amount']"
      sortMode="multiple"
      [tableStyle]="{ 'min-width': '1000px' }"
      class="text-base custom-paginator"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    >
      <!-- Header -->
      <ng-template pTemplate="header">
        <tr class="bg-blue-600 text-white text-sm uppercase tracking-wide">
          <th pSortableColumn="transactionDate" class="!text-center !py-4 !px-1 !font-semibold">
            Date <p-sortIcon field="transactionDate"></p-sortIcon>
          </th>
          <th pSortableColumn="categoryName" class="!text-center !py-4 !px-1 !font-semibold">
            Category <p-sortIcon field="categoryName"></p-sortIcon>
          </th>
          <th pSortableColumn="categoryType" class="!text-center !py-4 !px-1 !font-semibold">
            Type <p-sortIcon field="categoryType"></p-sortIcon>
          </th>
          <th pSortableColumn="description" class="!text-center !py-4 !px-1 !font-semibold">
            Description <p-sortIcon field="description"></p-sortIcon>
          </th>
          <th pSortableColumn="amount" class="!text-center !py-4 !px-1 !font-semibold">
            Amount <p-sortIcon field="amount"></p-sortIcon>
          </th>
          <th class="!py-4 !px-1 !text-center !font-semibold">Actions</th>
        </tr>
      </ng-template>

      <!-- Body -->
      <ng-template pTemplate="body" let-tx>
        <tr class="border-b border-gray-100 hover:bg-blue-50 transition-all duration-150">
          <td class="!py-4 !px-1 !text-center text-gray-700 font-medium">{{ tx.transactionDate }}</td>
          <td class="!py-4 !px-1 !text-center text-gray-700">{{ tx.categoryName }}</td>
          <td class="!py-4 !px-1 !text-center">
            <span
              class="px-3 py-1.5 rounded-md !font-semibold"
              [ngClass]="{
                'bg-green-100 text-green-700': tx.categoryType === 'Income',
                'bg-red-100 text-red-700': tx.categoryType === 'Expense'
              }"
            >
              {{ tx.categoryType }}
            </span>
          </td>
          <td class="!py-4 !px-1 !text-center text-gray-600">{{ tx.description }}</td>
          <td
            class="!py-4 !px-1 !text-center !font-semibold"
            [ngClass]="{
              'text-green-600': tx.categoryType === 'Income',
              'text-red-600': tx.categoryType === 'Expense'
            }"
          >
            ₹{{ tx.amount | number: '1.0-0' }}
          </td>
          <td class="!py-4 !px-1 !text-center">
            <app-action-buttons
            (edit)="editTransaction(tx)"
            (delete)="deleteTransaction(tx)"
            ></app-action-buttons>
          </td>
        </tr>
      </ng-template>

      <!-- Empty Message -->
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="8" class="!text-center !p-8 text-gray-500 !text-lg">
            <i class="pi pi-info-circle mr-2"></i> No transactions found.
          </td>
        </tr>
      </ng-template>
      
    </p-table>
  </div>

  <p class="text-sm text-gray-500 mt-5 sm:hidden !text-center">
    💡 Scroll horizontally to view all columns.
  </p>
</div>

<!-- Dialog -->
<p-dialog
  
  [(visible)]="isDialogVisible"
  [modal]="true"
  [draggable]="false"
  [closable]="false"
  [style]="{ width: '90vw', maxWidth: '500px' }"
  [breakpoints]="{ '640px': '95vw' }"
>
  <app-transaction-form
    [transaction]="selectedTransaction"
    [isEditMode]="isEditMode"
    (formSubmit)="handleTransactionSubmit($event)"
    (formCancel)="isDialogVisible = false"
  ></app-transaction-form>
</p-dialog>

<app-confirm-dialog
  [(visible)]="isConfirmVisible"
  title="Delete Transaction"
  message="Are you sure you want to delete this transaction?"
  confirmLabel="Yes, Delete"
  cancelLabel="Cancel"
  (confirm)="onDeleteConfirmed()"
  (cancel)="onDeleteCancelled()"
></app-confirm-dialog>
