 <!-- Header -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-10">
    <h1 class="text-3xl font-bold text-gray-800 flex items-center gap-2">
      <span *ngIf="emoji">{{ emoji }}</span> {{ title }}
    </h1>

    <div class="flex flex-wrap gap-3 items-center" *ngIf="showSearch || showAddButton">
      <!-- Search -->
      <div class="relative w-full sm:w-72 md:w-80" *ngIf="showSearch">
        <i class="pi pi-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
        <input
          type="text"
          pInputText
          [(ngModel)]="searchValue"
          (input)="onSearchChange()"
          [placeholder]="placeholder"
          class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-md text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm"
        />
      </div>

      <!-- Add Button -->
      <button
      *ngIf="showAddButton"
        pButton
        type="button"
        class="!bg-blue-600 hover:!bg-blue-700 !text-white !!font-semibold !px-6 !py-3 rounded-md !flex !items-center !justify-center !gap-2 !shadow-md !transition-all !duration-200"
        (click)="onAddClick()"
      > <span> <i class="{{ icons }}"></i></span>
        {{ showAddButtonText }}
      </button>
    </div>
  </div>
